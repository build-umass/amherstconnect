name: Verify

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
            server/package-lock.json

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install root verification dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run credential-free verification
        run: npm run verify

  verify-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Supabase CLI
        run: npm ci

      - name: Check generated seed data is current
        run: npm run db:seed:check

      - name: Start local Supabase database
        run: npm run supabase:start:ci

      - name: Apply migrations and configured seed data
        run: npm run supabase:reset

      - name: Run database tests
        run: npm run supabase:test

      - name: Lint local database
        run: npm run supabase:lint

      - name: Stop local Supabase services
        if: always()
        run: npm run supabase:stop
